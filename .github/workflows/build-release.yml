name: build-release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test, publish and package
        shell: pwsh
        run: pwsh -File tools/build-portable.ps1
      - name: Verify dist
        shell: pwsh
        run: |
          if (!(Test-Path dist/GSPTaskMiningAgent.exe)) { throw 'missing exe' }
          if (!(Test-Path dist/GSPTaskMiningAgentPortable.zip)) { throw 'missing portable zip' }
          tar -tf dist/GSPTaskMiningAgentPortable.zip | Select-String 'GSPTaskMiningAgent.exe'
      - name: Commit dist
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if (!(git diff --cached --quiet)) {
            git commit -m 'Update portable Windows build [skip ci]'
            git pull --rebase origin main
            git push
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GSPTaskMiningAgentPortable
          path: dist/GSPTaskMiningAgentPortable.zip
          if-no-files-found: error
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "pilot-${{ github.run_number }}" dist/GSPTaskMiningAgent.exe dist/GSPTaskMiningAgentPortable.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "GSPTaskMiningAgent pilot ${{ github.run_number }}" --notes "Self-contained Windows x64 portable build." --latest
