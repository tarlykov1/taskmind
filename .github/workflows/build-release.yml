name: build-release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Show .NET SDK
        shell: pwsh
        run: |
          dotnet --version
          dotnet --info
      - name: Verify .NET 8
        shell: pwsh
        run: |
          $version = dotnet --version
          if (-not $version.StartsWith("8.0.")) {
            throw "Expected .NET 8 SDK, actual SDK: $version"
          }
      - name: Restore icon assets
        shell: pwsh
        run: pwsh -File tools/restore-icons.ps1
      - name: Verify committed icons
        shell: pwsh
        run: |
          $icons = @(
            "src/GSPTaskMiningAgent/Assets/GSPTaskMining.ico",
            "src/GSPTaskMiningAgent/Assets/GSPTaskMiningGreen.ico",
            "src/GSPTaskMiningAgent/Assets/GSPTaskMiningYellow.ico",
            "src/GSPTaskMiningAgent/Assets/GSPTaskMiningRed.ico",
            "src/GSPTaskMiningAgent/Assets/GSPTaskMiningGray.ico"
          )
          Add-Type -AssemblyName System.Drawing
          foreach ($iconPath in $icons) {
            if (-not (Test-Path $iconPath)) { throw "Icon not found: $iconPath" }
            if ((Get-Item $iconPath).Length -le 0) { throw "Icon is empty: $iconPath" }
            $icon = [System.Drawing.Icon]::new((Resolve-Path $iconPath).Path)
            try {
              if ($icon.Width -le 0 -or $icon.Height -le 0) { throw "Invalid icon dimensions: $iconPath" }
            }
            finally { $icon.Dispose() }
          }
          if (-not (Test-Path "src/GSPTaskMiningAgent/Assets/GSPTaskMining.ico")) { throw "ApplicationIcon file is missing before build" }
      - name: Build, test, publish and package
        shell: pwsh
        run: pwsh -File tools/build-portable.ps1
      - name: Verify dist
        shell: pwsh
        run: |
          if (!(Test-Path dist/GSPTaskMiningAgent.exe)) { throw 'missing agent exe' }
          if (!(Test-Path dist/GSPTaskMiningAnalyzer.exe)) { throw 'missing analyzer exe' }
          if (!(Test-Path dist/GSPTaskMiningAgentPortable.zip)) { throw 'missing portable zip' }
          tar -tf dist/GSPTaskMiningAgentPortable.zip | Select-String 'GSPTaskMiningAgent.exe'
          tar -tf dist/GSPTaskMiningAgentPortable.zip | Select-String 'GSPTaskMiningAnalyzer.exe'
          tar -tf dist/GSPTaskMiningAgentPortable.zip | Select-String 'ANALYZE_LOGS.cmd'
      - name: Commit dist
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if (!(git diff --cached --quiet)) {
            git commit -m 'Update portable Windows build [skip ci]'
            git pull --rebase origin main
            git push
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GSPTaskMiningAgentPortable
          path: dist/GSPTaskMiningAgentPortable.zip
          if-no-files-found: error
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "pilot-${{ github.run_number }}" dist/GSPTaskMiningAgent.exe dist/GSPTaskMiningAnalyzer.exe dist/GSPTaskMiningAgentPortable.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "GSPTaskMiningAgent pilot ${{ github.run_number }}" --notes "Self-contained Windows x64 portable build." --latest
